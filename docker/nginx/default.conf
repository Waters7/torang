# Nginx di dalam kontainer: berkas statis dan FastCGI ke kontainer app.
# HTTPS dan domain ditangani Nginx host (deploy/nginx/torang-docker.conf).
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    # Lampiran PDF dibatasi 2 MB oleh aplikasi; lihat juga post_max_size di docker/php/php.ini.
    client_max_body_size 20M;

    # DNS Docker: alamat kontainer app bisa berubah setiap deploy.
    resolver 127.0.0.11 valid=10s;
    set $php_upstream app:9000;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Aset hasil Vite memakai nama ber-hash, aman di-cache lama.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass $php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # File PHP lain dan dotfile (.env, .git) tidak boleh diakses.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
