; Pengaturan PHP produksi TORANG.
date.timezone = Asia/Makassar
expose_php = Off
memory_limit = 256M

; Lampiran PDF dibatasi 2 MB oleh aplikasi; batas ini memberi ruang untuk template .docx
; dan unggahan sementara Livewire. Samakan dengan client_max_body_size di docker/nginx/default.conf.
upload_max_filesize = 16M
post_max_size = 20M

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
