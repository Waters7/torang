# Izinkan user biasa (termasuk www-data) mengirim ICMP echo lewat socket datagram,
# sehingga `ping` bisa dijalankan worker queue tanpa setuid/capability tambahan.
# Ubuntu modern umumnya sudah mengizinkan ini; pasang hanya bila `php artisan torang:check`
# melaporkan "Ping (ICMP)" gagal.
#
# Salin ke /etc/sysctl.d/99-torang-ping.conf lalu: sudo sysctl --system
# Alternatif: sudo setcap cap_net_raw+ep "$(command -v ping)"

net.ipv4.ping_group_range = 0 2147483647
