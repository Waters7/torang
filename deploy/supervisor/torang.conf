; Contoh konfigurasi Supervisor untuk worker queue TORANG.
; Salin ke /etc/supervisor/conf.d/torang.conf, sesuaikan path, lalu:
;   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl status
;
; --timeout setiap worker harus lebih kecil dari retry_after queue (DB_QUEUE_RETRY_AFTER, default 360)
; agar job yang masih berjalan tidak diambil ulang oleh worker lain.

; Monitoring jaringan & aplikasi: cek berjalan paralel (2–4 proses).
; CheckMonitorJob dibatasi 90 detik per cek.
[program:torang-monitoring]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/torang/artisan queue:work database --queue=monitoring --sleep=1 --tries=1 --timeout=120 --max-time=3600
directory=/var/www/torang
user=www-data
numprocs=3
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=150
redirect_stderr=true
stdout_logfile=/var/www/torang/storage/logs/worker-monitoring.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

; Antrean umum: email, notifikasi, konversi PDF UKOM (120 detik), backup database (300 detik).
[program:torang-default]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/torang/artisan queue:work database --queue=default --sleep=3 --tries=3 --backoff=30 --timeout=330 --max-time=3600
directory=/var/www/torang
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=360
redirect_stderr=true
stdout_logfile=/var/www/torang/storage/logs/worker-default.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
