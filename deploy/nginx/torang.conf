# Contoh konfigurasi Nginx untuk TORANG (Nginx 1.24 bawaan Ubuntu 24.04, PHP 8.3-FPM).
# 1. Ambil sertifikat dulu: sudo certbot certonly --nginx -d torang.example.ac.id
# 2. Salin file ini ke /etc/nginx/sites-available/torang, ganti torang.example.ac.id dan path.
# 3. sudo ln -s /etc/nginx/sites-available/torang /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
# Perpanjangan sertifikat berjalan otomatis lewat timer certbot.

server {
    listen 80;
    listen [::]:80;
    server_name torang.example.ac.id;

    # Dibutuhkan Certbot (validasi HTTP-01), selebihnya diarahkan ke HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Nginx ≥ 1.25.1: ganti menjadi `listen 443 ssl;` + `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name torang.example.ac.id;

    root /var/www/torang/public;
    index index.php;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/torang.example.ac.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/torang.example.ac.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TORANG:10m;
    ssl_session_timeout 1d;

    # Lampiran PDF dibatasi 2 MB oleh aplikasi; batas ini memberi ruang untuk template .docx
    # dan unggahan sementara Livewire. Samakan dengan upload_max_filesize/post_max_size PHP.
    client_max_body_size 20M;

    # Header keamanan dasar dikirim oleh aplikasi (middleware SecurityHeaders).
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Aset hasil Vite memakai nama ber-hash, aman di-cache lama.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # File PHP lain dan dotfile (.env, .git) tidak boleh diakses.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
