# Nginx host untuk TORANG versi Docker: HTTPS di sini, lalu diteruskan ke kontainer web.
# 1. Ambil sertifikat: sudo certbot certonly --nginx -d torang.example.ac.id
# 2. Salin ke /etc/nginx/sites-available/torang.example.ac.id, ganti domain, buat symlink ke sites-enabled.
# 3. sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name torang.example.ac.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name torang.example.ac.id;

    ssl_certificate /etc/letsencrypt/live/torang.example.ac.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/torang.example.ac.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Samakan dengan client_max_body_size di docker/nginx/default.conf.
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Ditimpa, bukan ditambah: nilai X-Forwarded-For dari pengunjung tidak boleh dipercaya.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}
